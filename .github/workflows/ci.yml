name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-v2-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-v2-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Verify Windows short-path identity
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: bun run scripts/verify-windows-paths.ts

      - name: Test
        timeout-minutes: 10
        run: bun test

      - name: Install Windows Rust target
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-msvc

      - name: Build Windows binary
        if: runner.os == 'Windows'
        shell: bash
        run: bun run build:win

      - name: Verify Windows audio addon
        if: runner.os == 'Windows'
        run: |
          bun -e 'const addon = require("./src/engine/voice/native/audio-capture.node"); if (typeof addon.startCapture !== "function" || typeof addon.stopCapture !== "function") process.exit(1);'

      - name: Verify Windows binary boots
        if: runner.os == 'Windows'
        run: |
          $expected = "otherside $((Get-Content package.json | ConvertFrom-Json).version)"
          $actual = & .\dist\otherside.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (($actual -join "`n").Trim() -ne $expected) { throw "Unexpected binary version: $actual" }

  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-v2-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-v2-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build smoke
        run: bun run build

      - name: Verify binary boots
        run: ./dist/otherside --help | grep -q "otherside"
