name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runs-on: macos-14
            bun-target: bun-darwin-arm64
            bun-version: canary
            rust-target: aarch64-apple-darwin
            apple-arch: arm64
          - target: darwin-x64
            runs-on: macos-15-intel
            bun-target: bun-darwin-x64
            bun-version: canary
            rust-target: x86_64-apple-darwin
            apple-arch: x64
          - target: linux-x64
            runs-on: ubuntu-latest
            bun-target: bun-linux-x64
            bun-version: canary
            rust-target: x86_64-unknown-linux-gnu
          - target: linux-arm64
            runs-on: ubuntu-24.04-arm
            bun-target: bun-linux-arm64
            bun-version: canary
            rust-target: aarch64-unknown-linux-gnu
          - target: windows-x64
            runs-on: windows-latest
            bun-target: bun-windows-x64
            bun-version: canary
            rust-target: x86_64-pc-windows-msvc
            ext: .exe
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # setup-bun cannot resolve engines.bun ranges; pin explicitly per target.
          bun-version: ${{ matrix.bun-version }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Linux audio build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev pkg-config

      - name: Setup Rust target
        shell: bash
        run: rustup target add ${{ matrix.rust-target }}

      - name: Build native audio addon
        run: bun run scripts/build-native-audio.ts ${{ matrix.rust-target }}

      - name: Build Apple Terminal addon
        if: runner.os == 'macOS'
        run: bun run scripts/build-native-apple-terminal.ts ${{ matrix.apple-arch }}

      - name: Verify native addon exports
        timeout-minutes: 1
        shell: bash
        run: |
          bun -e '
            const audio = require("./src/engine/voice/native/audio-capture.node");
            for (const name of ["startCapture", "stopCapture"]) {
              if (typeof audio[name] !== "function") throw new Error(`Missing audio export: ${name}`);
            }
            if (process.platform === "darwin") {
              const terminal = require("./src/platform/apple-terminal/native/apple-terminal-modifiers.node");
              if (typeof terminal.isShiftPressed !== "function") throw new Error("Missing terminal export: isShiftPressed");
            }
            console.log("Native addon exports verified");
          '

      - name: Build binary
        shell: bash
        run: |
          mkdir -p dist
          bun build \
            --compile \
            --target=${{ matrix.bun-target }} \
            --outfile=dist/otherside-${{ matrix.target }}${{ matrix.ext }} \
            src/main.ts

      - name: Sign macOS binary
        if: runner.os == 'macOS'
        shell: bash
        run: |
          binary="dist/otherside-${{ matrix.target }}"
          codesign --remove-signature "$binary" 2>/dev/null || true
          codesign --sign - "$binary"
          codesign --verify --strict --verbose=2 "$binary"

      - name: Verify binary version
        timeout-minutes: 1
        shell: bash
        run: |
          expected="otherside $(bun -p 'require("./package.json").version')"
          actual=$("./dist/otherside-${{ matrix.target }}${{ matrix.ext }}" --version)
          printf '%s\n' "$actual"
          test "$actual" = "$expected"

      - name: Compute checksum
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum otherside-${{ matrix.target }}${{ matrix.ext }} > otherside-${{ matrix.target }}${{ matrix.ext }}.sha256
          else
            shasum -a 256 otherside-${{ matrix.target }}${{ matrix.ext }} > otherside-${{ matrix.target }}${{ matrix.ext }}.sha256
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: otherside-${{ matrix.target }}
          path: |
            dist/otherside-${{ matrix.target }}${{ matrix.ext }}
            dist/otherside-${{ matrix.target }}${{ matrix.ext }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name 'otherside-*' \) -exec cp {} release/ \;
          ls -la release/

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              release/*
          fi
